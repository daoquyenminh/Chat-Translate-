<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Cydia Chatbot – Translate &amp; Learn English</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="shortcut icon" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="description" content="Chatbox dịch thuật cá nhân sang tiếng Anh nhắn tin tự nhiên như người bản xứ, copy nhanh và tự động lưu log." />
    <meta property="og:title" content="Cydia Chatbot – Translate &amp; Learn English" />
    <meta property="og:description" content="Chatbox dịch thuật cá nhân sang tiếng Anh nhắn tin tự nhiên như người bản xứ, copy nhanh và tự động lưu log." />
    <meta property="og:image" content="/logo.svg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" as="image" href="/logo.svg" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('cydia_translate_theme_v1');
          if (!raw) return;
          var t = JSON.parse(raw);
          var r = document.documentElement.style;
          if (t && t.accentColor) r.setProperty('--cydia-accent', t.accentColor);
          if (t && t.userBubbleColor) r.setProperty('--cydia-user-bg', t.userBubbleColor);
          if (t && t.botBubbleColor) r.setProperty('--cydia-bot-bg', t.botBubbleColor);
          if (t && t.chatBgColor) r.setProperty('--cydia-chat-bg', t.chatBgColor);
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAFAFA] text-[#111111] antialiased selection:bg-[#111111] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
